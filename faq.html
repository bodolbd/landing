<!DOCTYPE html>
<html lang="bn">
  <head>

    <link rel="icon" href="assets/favicon.ico" />

    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>

        theme: {

          data-nav-toggle

          aria-controls="mobile-nav"
          aria-label="মেনু"

      <div class="mx-auto flex max-w-3xl justify-between gap-4">
        <span>© <span data-year>2026</span> Bodol</span>
        <a href="mailto:support@bodol.com" class="hover:text-white">সাপোর্ট</a>
